[package]
name = "slashstep-server"
version = "0.1.0"
edition = "2024"
description = "A server for hosting a Slashstep Server instance."
readme = "README.md"
homepage = "https://slashstep.com"
repository = "https://github.com/SlashstepGroup/slashstep-server"
license = "MPL-2.0"
keywords = ["project management", "problem management", "issue tracking"]
publish = false
resolver = "2"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.44", features = ["serde"] }
colored = "3.1.1"
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
dotenvy = "0.15.7"
local-ip-address = "0.6.13"
pg_escape = "0.1.1"
postgres = { version = "0.19.13", features = ["with-uuid-1", "with-chrono-0_4"] }
postgres-types = { version = "0.2.13", features = ["derive"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.2", features = ["v7", "serde"] }
reqwest = { version = "0.13.4", features = ["json", "cookies"] }
tower = "0.5.3"
ntest = "0.9.5"
axum-extra = { version = "0.12.6", features = ["cookie", "erased-json"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
axum-macros = "0.5.1"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.10.1"
argon2 = "0.5.3"
sha2 = "0.11.0"
base64 = "0.22.1"
rust_decimal = { version = "1.42.0", features = ["rand", "db-postgres", "db-tokio-postgres"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rpassword = "7.5.4"
axum_typed_multipart = "0.16.6"
little_exif = "0.6.23"
image = "0.25.10"
infer = "0.19.0"
usvg = "0.47.0"
svg-hush = "0.9.6"
serde_with = "3.21.0"
time = "0.3.47"
deadpool-redis = "0.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower-http = { version = "0.6.11", features = ["trace"] }
url = "2.5.8"
rcgen = "0.14.8"
yaml_serde = "0.10.4"
# OpenSearch includes native-tls by default, which is incompatible with rustls-tls
opensearch = { version = "2.4.0", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
axum-test = "20.0.0"
anyhow = "1.0.102"
postgresql_embedded = { version = "0.20.2", features = ["bundled", "theseus", "rustls"], default-features = false }
redis-test = "1.0.4"
semver = "1.0.28"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
