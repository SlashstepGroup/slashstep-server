info:
  name: Create a session credential using a username and password
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/session-credentials"
  body:
    type: json
    data: |-
      {
        "authentication_method": "LoginCredentials",
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: ""
    - name: password
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
