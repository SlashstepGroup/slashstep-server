info:
  name: Create a session credential using a refresh token
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/session-credentials"
  body:
    type: json
    data: |-
      {
        "authentication_method": "RefreshToken"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
