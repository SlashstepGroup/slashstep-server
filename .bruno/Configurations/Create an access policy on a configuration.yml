info:
  name: Create an access policy on a configuration
  type: http

http:
  method: POST
  url: "{{base_url}}/configurations/:configuration_id/access-policies"
  params:
    - name: configuration_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
