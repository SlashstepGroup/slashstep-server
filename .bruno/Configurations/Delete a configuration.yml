info:
  name: Delete a configuration
  type: http

http:
  method: DELETE
  url: "{{base_url}}/configurations/:configuration_id"
  params:
    - name: configuration_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
