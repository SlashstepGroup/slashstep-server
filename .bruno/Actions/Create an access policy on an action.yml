info:
  name: Create an access policy on an action
  type: http

http:
  method: POST
  url: "{{base_url}}/actions/:action_id/access-policies"
  params:
    - name: action_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
