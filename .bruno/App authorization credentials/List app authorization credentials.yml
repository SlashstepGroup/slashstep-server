info:
  name: List app authorization credentials
  type: http

http:
  method: GET
  url: "{{base_url}}/app-authorization-credentials"
  params:
    - name: query
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
