info:
  name: Get an app authorization credential
  type: http

http:
  method: GET
  url: "{{base_url}}/app-authorization-credentials/:app_authorization_credential_id"
  params:
    - name: app_authorization_credential_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
