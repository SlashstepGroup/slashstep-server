info:
  name: Get an app authorization
  type: http

http:
  method: GET
  url: "{{base_url}}/app-authorizations/:app_authorization_id"
  params:
    - name: app_authorization_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
