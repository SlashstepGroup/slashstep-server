info:
  name: List access policies on an app authorization
  type: http

http:
  method: GET
  url: "{{base_url}}/app-authorizations/:app_authorization_id/access-policies"
  params:
    - name: query
      value: ""
      type: query
      disabled: true
    - name: app_authorization_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
