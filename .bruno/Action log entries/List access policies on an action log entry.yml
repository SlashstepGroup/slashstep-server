info:
  name: List access policies on an action log entry
  type: http

http:
  method: GET
  url: "{{base_url}}/action-log-entries/:action_log_entry_id/access-policies"
  params:
    - name: action_log_entry_id
      value: ""
      type: path
    - name: query
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
