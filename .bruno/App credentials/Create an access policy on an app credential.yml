info:
  name: Create an access policy on an app credential
  type: http

http:
  method: POST
  url: "{{base_url}}/app-credentials/:app_credential_id/access-policies"
  params:
    - name: app_credential_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
