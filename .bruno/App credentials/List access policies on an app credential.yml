info:
  name: List access policies on an app credential
  type: http

http:
  method: GET
  url: "{{base_url}}/app-credentials/:app_credential_id/access-policies"
  params:
    - name: app_credential_id
      value: ""
      type: path
    - name: query
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
