# This is a Compose file to deploy Slashstep Server and PostgreSQL in a pod.
name: slashstep-server

# Adjust these values as needed for your environment.
#
# You or your secret manager needs to create these secrets in the appropriate
# directory before deploying this pod.
secrets:
  postgresql-password:
    file: ./secrets/postgresql-password.txt
  jwt-public-key:
    file: ./secrets/jwt-public-key.pem
  jwt-private-key:
    file: ./secrets/jwt-private-key.pem
  slashstep-admin-password:
    file: ./secrets/slashstep-admin-password.txt
  opensearch-root-ca:
    file: ./secrets/opensearch-root-ca.pem
  opensearch-node-certificate:
    file: ./secrets/opensearch-node-certificate.pem
  opensearch-node-key:
    file: ./secrets/opensearch-node-key.pem

services:

  slashstep-server:
    image: slashstep-server
    build:
      context: .
      dockerfile: ./Containerfile
    ports:
      - "3001:3001"
    expose:
      - "3001"
    environment:
      APP_PORT: "3001"
      POSTGRESQL_HOST: postgresql-server
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE_NAME: slashstep
      POSTGRESQL_USERNAME: slashstep
      POSTGRESQL_PASSWORD_FILE_PATH: /run/secrets/postgresql-password
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public-key
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private-key
      MAXIMUM_POSTGRESQL_CONNECTION_COUNT: 20
      SLASHSTEP_ADMIN_USERNAME: Admin
      SLASHSTEP_ADMIN_PASSWORD_FILE_PATH: /run/secrets/slashstep-admin-password
      REDIS_URL: redis://valkey-server:6379
      OPENSEARCH_URL: http://opensearch-node-1:9200
    secrets:
      - postgresql-password
      - jwt-public-key
      - jwt-private-key
      - slashstep-admin-password
    depends_on:
      - postgresql-server
      - valkey-server

  postgresql-server:
    image: postgres:18.3
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_USER: slashstep
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql-password
      POSTGRES_DB: slashstep
    volumes:
      - postgresql-data:/var/lib/postgresql
    secrets:
      - postgresql-password

  valkey-server:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  opensearch-node-1:
    image: opensearchproject/opensearch:3.6.0
    # command: tail -f /dev/null
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./opensearch-config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch-config/roles.yml:/usr/share/opensearch/config/roles.yml:ro
      - ./opensearch-config/roles_mapping.yml:/usr/share/opensearch/config/roles_mapping.yml:ro
      - ./opensearch-config/opensearch-security:/usr/share/opensearch/config/opensearch-security/config:ro
    expose:
      - "9200"
      - "9300"
    environment:
      # TODO: Look into multiple nodes later on.
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - DISABLE_PERFORMANCE_ANALYZER_AGENT=true
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    secrets:
      - opensearch-root-ca
      - opensearch-node-key
      - opensearch-node-certificate

volumes:
  postgresql-data:
  valkey-data:
  opensearch-data: